name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      # The Worker URL comes from the committed .env. Don't set VITE_WORKER_URL here:
      # an unset repo variable expands to "" and would override it.
      - run: npm run build
        env:
          VITE_BASE: /
      # GitHub Pages has no SPA fallback; serving index.html as the 404 page makes deep
      # links like /login (the OAuth redirect) boot the app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
